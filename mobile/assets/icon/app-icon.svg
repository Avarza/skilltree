<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- SkillTree app icon source (1024×1024, no rounded corners: iOS/Android mask it).
       "SK" = Plus Jakarta Sans ExtraBold converted to paths, so rendering doesn't depend on installed fonts.
       PNGs in ios/SkillTree/Images.xcassets/AppIcon.appiconset and android/.../mipmap-* are rendered from this file. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#0E2230"/>
      <stop offset="0.55" stop-color="#08111B"/>
      <stop offset="1" stop-color="#04070C"/>
    </radialGradient>
    <radialGradient id="nebula" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.30"/>
      <stop offset="0.6" stop-color="#10B981" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <ellipse cx="512" cy="512" rx="430" ry="360" fill="url(#nebula)"/>

  <g fill="#E6FBFF">
    <circle cx="168" cy="196" r="5" opacity="0.8"/>
    <circle cx="842" cy="168" r="4" opacity="0.7"/>
    <circle cx="884" cy="760" r="5" opacity="0.6"/>
    <circle cx="138" cy="780" r="4" opacity="0.55"/>
    <circle cx="300" cy="880" r="3" opacity="0.5"/>
    <circle cx="730" cy="880" r="4" opacity="0.5"/>
    <circle cx="320" cy="130" r="3" opacity="0.45"/>
    <circle cx="700" cy="140" r="3" opacity="0.4"/>
  </g>

