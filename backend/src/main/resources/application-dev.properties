# Local development without Docker: file-based H2 (backend/data/, survives restarts) in PostgreSQL mode.
# Run with SPRING_PROFILES_ACTIVE=postgres to use the docker-compose database instead.
spring.datasource.url=jdbc:h2:file:./data/skilltree-dev;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.placeholders.json_type=character varying

# Dev-only secret and seeded admin account. Never use these outside local development.
skilltree.jwt.secret=dev-only-secret-change-me-0123456789abcdef
skilltree.cms.require-four-eyes=false
skilltree.dev.admin-email=admin@skilltree.local
skilltree.dev.admin-password=admin12345
