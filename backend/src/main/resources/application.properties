spring.application.name=skilltree-backend
spring.profiles.default=dev
server.port=${PORT:8090}

# PostgreSQL (docker-compose / production). Override via env: SPRING_DATASOURCE_URL etc.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/skilltree?stringtype=unspecified}
spring.datasource.username=${DATABASE_USER:skilltree}
spring.datasource.password=${DATABASE_PASSWORD:skilltree}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.placeholders.json_type=jsonb

management.endpoints.web.exposure.include=health,info

skilltree.jwt.secret=${JWT_SECRET:}
skilltree.jwt.ttl=8h
skilltree.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
skilltree.cms.require-four-eyes=true
skilltree.ai.api-key=${ANTHROPIC_API_KEY:}
skilltree.ai.model=claude-opus-5-5
skilltree.ai.max-tokens=16000
